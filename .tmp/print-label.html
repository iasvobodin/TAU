<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Label</title>
    <style>
        body,
        html {
            transform: scale(2.1);
            transform-origin: top left;
            margin: 0;
            padding: 0;
            height: 20mm;
            width: 30mm;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .label {
            width: 27mm;
            height: 18mm;
            display: grid;
            align-content: space-evenly;
        }

        .label img {
            align-self: center;
            justify-self: center;
            row-gap: 1mm;
            width: 100%;
            height: 4mm;
        }

        p {
            align-self: center;
            font-size: 10mm;
            text-align: center;
            font-family: "Arial Narrow", Arial, sans-serif;
            line-height: 1;
            margin-block-start: 0px;
            margin-block-end: 0px;
        }

        .p6 {
            font-size: 7px;
            justify-self: end;
        }

        .p7 {
            font-size: 7px;
        }

        @media print {
            @page {
                size: 30mm 20mm;
                margin: 0;
            }

            body,
            html {
                transform: scale(1);
                width: 30mm;
                height: 20mm;
                margin: 0;
                padding: 0;
            }

            .label {
                width: 27mm;
                height: 18mm;
                margin: 0;
            }
        }
    </style>
</head>
