<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Label</title>
    <style>
        body,
        html {
            transform: scale(2.1);
            transform-origin: top left;
            margin: 0;
            padding: 0;
            height: 20mm;
            width: 30mm;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .label {
            width: 27mm;
            height: 18mm;
            display: grid;
            align-content: space-evenly;
        }

        .label img {
            align-self: center;
            justify-self: center;
            row-gap: 1mm;
            width: 100%;
            height: 4mm;
        }

        p {
            align-self: center;
            font-size: 8px;
            font-family: "Arial Narrow", Arial, sans-serif;
            line-height: 1;
            margin-block-start: 0px;
            margin-block-end: 0px;
        }

        .p6 {
            font-size: 7px;
            justify-self: end;
        }

        .p7 {
            font-size: 7px;
        }

        @media print {
            @page {
                size: 30mm 20mm;
                margin: 0;
            }

            body,
            html {
                transform: scale(1);
                width: 30mm;
                height: 20mm;
                margin: 0;
                padding: 0;
            }

            .label {
                width: 27mm;
                height: 18mm;
                margin: 0;
            }
        }
    </style>
</head>

<body>
    <div class="label">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFwAAAAYCAYAAAB3JpoiAAAAAXNSR0IArs4c6QAAAOpJREFUaEPtmcEOgCAMQ/H/P1pjhJg11s6Tl+cNRIQ6u65sY4x91GubzdW/2muU65dp7LxpHl3PGq/rSv16/+t7dd/6vO7X4Vb2cw4C8As6h0MKJPfhHwMEwG84ATxQHZQiAKWISTkicSSAA3jJBXB4U305dYNKmQg4uYgsNJTjdD4cHn7JpFe7BRSFTzMyAbwWUCRNkuaFABzejARn7jj5BIfP6MK8wrzS/FuoJwWIk5P65yUqw54VqsNLwUvBS3lTQVCKoYxEHXgpgWu/Ji8AF5fuUVI0zgg5gDB2Z7dgwUvBS3m1Dn5JmgfL/jgQpEctIgAAAABJRU5ErkJggg==" alt="Barcode" />
        <p class="p8">SN:4</p>
        <p class="p8">PN:MP3204X1-BA1</p>
        <p class="p6">Модуль дискретного вывода 32-канальный, 24В, потенциальный контакт
</p>
        <p class="p6">OOO "Метран Проект"</br>Россия</p>
    </div>

    <script>
        window.onload = function () {
            window.print();
        }
    </script>
</body>

</html>
